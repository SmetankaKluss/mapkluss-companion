plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'maven-publish'
}

def targets = [
    '26.2': [
        java: 25,
        loader: '0.19.3',
        fabricApi: '0.155.2+26.2',
        mappings: null,
        minecraftSources: ['minecraft262'],
        compatSources: 'compat262',
        testSources: ['test262'],
        unobfuscated: true,
    ],
    '1.21.11': [
        java: 21,
        loader: '0.17.3',
        mappings: '1.21.11+build.1',
        minecraftSources: ['minecraftLegacy', 'minecraft1218plus'],
        compatSources: 'compat12111',
        testSources: ['testLegacy', 'test1218plus'],
        unobfuscated: false,
    ],
    '1.21.8': [
        java: 21,
        loader: '0.17.3',
        mappings: '1.21.8+build.1',
        minecraftSources: ['minecraftLegacy', 'minecraft1218plus'],
        compatSources: 'compat1218',
        testSources: ['testLegacy', 'test1218plus'],
        unobfuscated: false,
    ],
    '1.21.4': [
        java: 21,
        loader: '0.17.3',
        fabricApi: '0.119.4+1.21.4',
        mappings: '1.21.4+build.8',
        minecraftSources: ['minecraftLegacy', 'minecraft1214'],
        compatSources: 'compat1214',
        testSources: ['testLegacy', 'test1214'],
        unobfuscated: false,
    ],
]

def targetMinecraft = providers.gradleProperty('minecraft_version').get()
def target = targets[targetMinecraft]
if (target == null) {
    throw new GradleException("Unsupported minecraft_version '${targetMinecraft}'. Supported targets: ${targets.keySet().join(', ')}")
}
def uiLabEnabled = providers.gradleProperty('mapkluss_ui_lab').orElse('false').get().toBoolean()
def uiLabJavaHome = providers.gradleProperty('mapkluss_ui_lab_java_home').orNull
def uiLabJavaExecutable = providers.gradleProperty('mapkluss_ui_lab_java_executable').orNull
def uiLabCaptureOnOpen = providers.gradleProperty('mapkluss_ui_lab_capture_on_open').orElse('false').get()

apply plugin: target.unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

loom {
    providers.gradleProperty('minecraft_manifest_url').orNull?.with { manifestUrl ->
        customMinecraftManifest.set(manifestUrl)
    }
    if (uiLabEnabled) {
        runs {
            client {
                vmArgs '-XX:+AllowEnhancedClassRedefinition'
                vmArgs '-Xdock:name=MapKluss UI Lab'
                vmArgs '-Dapple.awt.application.name=MapKluss UI Lab'
                vmArgs '-Dmapkluss.uiLab.autoOpen=true'
                vmArgs "-Dmapkluss.uiLab.captureOnOpen=${uiLabCaptureOnOpen}"
            }
        }
    }
}

repositories {
    def fabricMavenUrl = providers.gradleProperty('fabric_maven_url').orElse('https://maven.fabricmc.net/').get()
    def allowInsecureFabricMaven = providers.gradleProperty('fabric_maven_allow_insecure').orElse('false').get().toBoolean()
    maven {
        url = uri(fabricMavenUrl)
        allowInsecureProtocol = allowInsecureFabricMaven
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    if (!target.unobfuscated) {
        mappings "net.fabricmc:yarn:${target.mappings}:v2"
    }
    add(target.unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${target.loader}")
    if (target.fabricApi != null) {
        add(target.unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}")
    } else if (targetMinecraft == '1.21.11') {
        modImplementation "net.fabricmc.fabric-api:fabric-api-base:1.0.5+4ebb5c083e"
        modImplementation "net.fabricmc.fabric-api:fabric-key-binding-api-v1:1.1.7+4fc5413f3e"
        modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.6.15+4ebb5c083e"
        modImplementation "net.fabricmc.fabric-api:fabric-rendering-v1:16.2.6+1fb1cde93e"
        if (uiLabEnabled) {
            modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
        }
    } else {
        modImplementation "net.fabricmc.fabric-api:fabric-api-base:0.5.0+cd8c0daa2c"
        modImplementation "net.fabricmc.fabric-api:fabric-key-binding-api-v1:1.0.65+946bf4c32c"
        modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.6.4+db4dfd852c"
        modImplementation "net.fabricmc.fabric-api:fabric-rendering-v1:12.6.0+486b7ff72c"
    }
    implementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(target.java)
        if (uiLabEnabled) {
            vendor = JvmVendorSpec.JETBRAINS
        }
    }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            target.minecraftSources.each { sourceName -> srcDir "src/${sourceName}/java" }
            srcDir "src/${target.compatSources}/java"
            if (uiLabEnabled) {
                srcDir 'src/uiLabShared/java'
                srcDir target.unobfuscated ? 'src/uiLab262/java' : 'src/uiLabLegacy/java'
            }
        }
        resources {
            if (uiLabEnabled) {
                srcDir 'src/uiLab/resources'
            }
        }
    }
    test {
        java {
            target.testSources.each { sourceName -> srcDir "src/${sourceName}/java" }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}

tasks.withType(JavaExec).configureEach {
    if (uiLabEnabled && uiLabJavaHome != null && name == 'runClient') {
        def uiLabExecutableFile = layout.file(providers.provider {
            file(uiLabJavaExecutable ?: "${uiLabJavaHome}/bin/java")
        })
        def uiLabBaseLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(target.java)
            vendor = JvmVendorSpec.JETBRAINS
        }
        javaLauncher.set(providers.provider {
            def baseLauncher = uiLabBaseLauncher.get()
            [
                getExecutablePath: { uiLabExecutableFile.get() },
                getMetadata: { baseLauncher.metadata },
            ] as org.gradle.jvm.toolchain.JavaLauncher
        })
    }
}

test {
    useJUnitPlatform()
    systemProperty 'mapkluss.test.minecraftVersion', targetMinecraft
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'java_version', target.java
    inputs.property 'mixin_compatibility', "JAVA_${target.java}"
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version, 'java_version': target.java
    }
    filesMatching('mapkluss-companion.mixins.json') {
        expand 'mixin_compatibility': "JAVA_${target.java}"
    }
}

tasks.register('verifyProductionJarExcludesUiLab') {
    dependsOn tasks.named('jar')
    onlyIf { !uiLabEnabled }
    doLast {
        def labEntries = zipTree(tasks.named('jar').get().archiveFile.get().asFile)
            .matching {
                include 'art/mapkluss/companion/MapKlussUiLab*.class'
                include 'assets/mapkluss-ui-lab/**'
            }
            .files
        if (!labEntries.isEmpty()) {
            throw new GradleException("Production JAR contains MapKluss UI Lab classes: ${labEntries}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProductionJarExcludesUiLab')
}
