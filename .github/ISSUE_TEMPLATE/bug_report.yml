name: Bug report
description: Report a MapKluss Companion problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - 26.2
        - 1.21.11
        - 1.21.8
        - 1.21.4
    validations:
      required: true
  - type: input
    id: companion
    attributes:
      label: Companion version
      placeholder: 0.11.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Press...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant mods and environment
      description: Include Fabric Loader/API, Litematica/MaLiLib versions, server or single-player, and GUI scale when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, device codes, private art data, server addresses, and personal paths before attaching files.
