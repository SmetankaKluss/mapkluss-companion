name: Fabric CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            java: '25'
          - minecraft: 1.21.11
            java: '21'
          - minecraft: 1.21.8
            java: '21'
          - minecraft: 1.21.4
            java: '21'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Test and build
        run: |
          ./gradlew --no-daemon clean test build \
            -Pminecraft_version=${{ matrix.minecraft }}
      - name: Record checksums
        run: sha256sum build/libs/mapkluss-companion-${{ matrix.minecraft }}-*.jar
