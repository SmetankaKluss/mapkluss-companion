name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Validate release tag
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build supported Minecraft versions
        run: |
          mkdir -p release
          for minecraft in 26.2 1.21.11 1.21.8 1.21.4; do
            ./gradlew --no-daemon clean test build -Pminecraft_version="$minecraft"
            cp "build/libs/mapkluss-companion-${minecraft}-${GITHUB_REF_NAME#v}.jar" release/
          done
      - name: Create checksums
        run: |
          cd release
          sha256sum -- ./*.jar > "SHA256SUMS-${GITHUB_REF_NAME#v}.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "MapKluss Companion ${GITHUB_REF_NAME#v}" \
            --generate-notes
